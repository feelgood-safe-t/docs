<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660" font-family="'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
  <rect width="1600" height="660" fill="#ffffff"/>
  <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa8b5"/></marker></defs>

  <text x="30" y="44" font-size="25" font-weight="700" fill="#8794a1">화면</text>
  <text x="1420" y="44" font-size="23" fill="#6b5c96">보라 = AI 처리</text>

  <!-- row 1 -->
  <g>
    <rect x="30" y="70" width="340" height="150" rx="10" fill="#f7f9fb" stroke="#c8d2db" stroke-width="2"/>
    <text x="56" y="112" font-size="30" font-weight="700" fill="#16202b">랜딩</text>
    <text x="56" y="150" font-size="24" fill="#5b6b7a">로그인 없이 바로 시작</text>
    <text x="56" y="184" font-size="24" fill="#5b6b7a">설문 시작하기 선택</text>

    <rect x="440" y="70" width="340" height="150" rx="10" fill="#f7f9fb" stroke="#c8d2db" stroke-width="2"/>
    <text x="466" y="112" font-size="30" font-weight="700" fill="#16202b">온보딩 설문</text>
    <text x="466" y="150" font-size="24" fill="#5b6b7a">10문항, 한 화면에 한 문항</text>
    <text x="466" y="184" font-size="24" font-weight="700" fill="#1c5fa8">약 1~2분</text>

    <rect x="850" y="70" width="340" height="150" rx="10" fill="#f4f1fa" stroke="#8b7bb8" stroke-width="2.5"/>
    <text x="876" y="112" font-size="30" font-weight="700" fill="#4a3c74">성향 분석</text>
    <text x="876" y="150" font-size="24" fill="#6b5c96">요약, 강점, 취약점, 학습 항목</text>
    <text x="876" y="184" font-size="24" font-weight="700" fill="#4a3c74">약 10초</text>

    <rect x="1260" y="70" width="310" height="150" rx="10" fill="#f4f1fa" stroke="#8b7bb8" stroke-width="2.5"/>
    <text x="1286" y="112" font-size="30" font-weight="700" fill="#4a3c74">시나리오 배정</text>
    <text x="1286" y="150" font-size="24" fill="#6b5c96">세 개 선택</text>
    <text x="1286" y="184" font-size="24" fill="#6b5c96">선택 근거 표시</text>
  </g>
  <g stroke="#9aa8b5" stroke-width="2.5" marker-end="url(#a4)">
    <line x1="376" y1="145" x2="430" y2="145"/><line x1="786" y1="145" x2="840" y2="145"/><line x1="1196" y1="145" x2="1250" y2="145"/>
  </g>
  <!-- wrap -->
  <path d="M1415 226 L1415 262 L200 262 L200 298" fill="none" stroke="#9aa8b5" stroke-width="2.5" marker-end="url(#a4)"/>

  <!-- row 2 -->
  <g>
    <rect x="30" y="304" width="340" height="150" rx="10" fill="#f7f9fb" stroke="#c8d2db" stroke-width="2"/>
    <text x="56" y="346" font-size="30" font-weight="700" fill="#16202b">평가 준비</text>
    <text x="56" y="384" font-size="24" fill="#5b6b7a">7개 항목과 배점 사전 공개</text>
    <text x="56" y="418" font-size="24" fill="#5b6b7a">시작 선택</text>

    <rect x="440" y="286" width="340" height="186" rx="10" fill="#eef4fb" stroke="#1c5fa8" stroke-width="3"/>
    <text x="466" y="330" font-size="30" font-weight="700" fill="#123f70">평가</text>
    <text x="466" y="366" font-size="24" fill="#2b5a8c">60배속 재생, 정보 순차 공개</text>
    <text x="466" y="398" font-size="24" fill="#2b5a8c">판단 제출과 재제출</text>
    <text x="466" y="440" font-size="24" font-weight="700" fill="#123f70">시나리오 1·2·3 · 각 최대 3분</text>

    <rect x="850" y="304" width="340" height="150" rx="10" fill="#f4f1fa" stroke="#8b7bb8" stroke-width="2.5"/>
    <text x="876" y="346" font-size="30" font-weight="700" fill="#4a3c74">채점</text>
    <text x="876" y="384" font-size="24" fill="#6b5c96">7개 항목 점수와 근거</text>
    <text x="876" y="418" font-size="24" font-weight="700" fill="#4a3c74">약 20~30초</text>

    <rect x="1260" y="304" width="310" height="150" rx="10" fill="#123f70"/>
    <text x="1286" y="346" font-size="30" font-weight="700" fill="#ffffff">결과</text>
    <text x="1286" y="384" font-size="24" fill="#cddcec">항목 점수, 총점, 통과 여부</text>
    <text x="1286" y="418" font-size="24" fill="#cddcec">통과 시 INVEST PASS</text>
  </g>
  <g stroke="#9aa8b5" stroke-width="2.5" marker-end="url(#a4)">
    <line x1="376" y1="379" x2="430" y2="379"/><line x1="786" y1="379" x2="840" y2="379"/><line x1="1196" y1="379" x2="1250" y2="379"/>
  </g>

  <line x1="30" y1="540" x2="1570" y2="540" stroke="#e3e9ee" stroke-width="2"/>
  <text x="30" y="582" font-size="24" fill="#5b6b7a">각 시나리오에서 최소 한 번은 판단해야 완료할 수 있다. 판단 없이 닫힌 시나리오는 0점으로 처리된다.</text>
  <text x="30" y="618" font-size="24" fill="#5b6b7a">진행 중 화면을 새로 고쳐도 현재 상태에서 이어진다. 첫 시나리오에서 조기 종료하면 약 3분 만에 결과까지 확인할 수 있다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" font-family="'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
  <rect width="1600" height="620" fill="#ffffff"/>
  <text x="30" y="44" font-size="25" font-weight="700" fill="#8794a1">화면</text>
  <rect x="1400" y="24" width="30" height="26" rx="4" fill="#f4f1fa" stroke="#8b7bb8" stroke-width="2"/>
  <text x="1444" y="45" font-size="23" fill="#5b6b7a">= AI 처리</text>

  <!-- row 1 -->
  <rect x="30" y="76" width="470" height="176" rx="10" fill="#f7f9fb" stroke="#c8d2db" stroke-width="2"/>
  <text x="58" y="124" font-size="31" font-weight="700" fill="#16202b">랜딩</text>
  <text x="58" y="166" font-size="25" fill="#5b6b7a">로그인 없이 바로 시작</text>
  <text x="58" y="204" font-size="25" fill="#5b6b7a">설문 시작하기 선택</text>

  <rect x="565" y="76" width="470" height="176" rx="10" fill="#f7f9fb" stroke="#c8d2db" stroke-width="2"/>
  <text x="593" y="124" font-size="31" font-weight="700" fill="#16202b">온보딩 설문</text>
  <text x="593" y="166" font-size="25" fill="#5b6b7a">10문항, 한 화면에 한 문항</text>
  <text x="593" y="204" font-size="25" font-weight="700" fill="#1c5fa8">약 1~2분</text>

  <rect x="1100" y="76" width="470" height="176" rx="10" fill="#f4f1fa" stroke="#8b7bb8" stroke-width="2.5"/>
  <text x="1128" y="124" font-size="31" font-weight="700" fill="#4a3c74">성향 분석</text>
  <text x="1128" y="166" font-size="25" fill="#6b5c96">요약, 강점, 취약점, 학습 항목</text>
  <text x="1128" y="204" font-size="25" font-weight="700" fill="#4a3c74">약 10초</text>

  <g stroke="#9aa8b5" stroke-width="2.5">
    <line x1="506" y1="164" x2="559" y2="164"/><line x1="1041" y1="164" x2="1094" y2="164"/>
  </g>
  <path d="M1335 258 L1335 292 L265 292 L265 326" fill="none" stroke="#9aa8b5" stroke-width="2.5"/>

  <!-- row 2 -->
  <rect x="30" y="332" width="470" height="196" rx="10" fill="#eef4fb" stroke="#1c5fa8" stroke-width="3"/>
  <text x="58" y="380" font-size="31" font-weight="700" fill="#123f70">평가</text>
  <text x="58" y="422" font-size="25" fill="#2b5a8c">60배속 재생, 정보 순차 공개</text>
  <text x="58" y="458" font-size="25" fill="#2b5a8c">판단 제출과 재제출</text>
  <text x="58" y="500" font-size="25" font-weight="700" fill="#123f70">시나리오 1·2·3 · 각 최대 3분</text>

  <rect x="565" y="342" width="470" height="176" rx="10" fill="#f4f1fa" stroke="#8b7bb8" stroke-width="2.5"/>
  <text x="593" y="390" font-size="31" font-weight="700" fill="#4a3c74">채점</text>
  <text x="593" y="432" font-size="25" fill="#6b5c96">7개 항목 점수와 근거</text>
  <text x="593" y="470" font-size="25" font-weight="700" fill="#4a3c74">약 20~30초</text>

  <rect x="1100" y="342" width="470" height="176" rx="10" fill="#123f70"/>
  <text x="1128" y="390" font-size="31" font-weight="700" fill="#ffffff">결과</text>
  <text x="1128" y="432" font-size="25" fill="#cddcec">항목 점수, 총점, 통과 여부</text>
  <text x="1128" y="470" font-size="25" fill="#cddcec">통과 시 INVEST PASS</text>

  <g stroke="#9aa8b5" stroke-width="2.5">
    <line x1="506" y1="430" x2="559" y2="430"/><line x1="1041" y1="430" x2="1094" y2="430"/>
  </g>

  <line x1="30" y1="556" x2="1570" y2="556" stroke="#e3e9ee" stroke-width="2"/>
  <text x="30" y="596" font-size="24" fill="#5b6b7a">각 시나리오에서 최소 한 번은 판단해야 완료할 수 있다. 판단 없이 끝낸 시나리오는 0점으로 처리된다. 평가 항목과 배점은 평가 중 평가 안내에서 언제든 열어 볼 수 있다.</text>
</svg>
